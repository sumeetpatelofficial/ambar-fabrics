name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APP_URL: https://ci.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version is read from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Cache the mongod binary that mongodb-memory-server downloads for integration tests.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Production dependencies only. A dev-only advisory (braces <=3.0.3 via eslint-config-next) has no
      # patched release yet; tracked in docs/project-status.md. Re-run a full `pnpm audit` periodically.
      - name: Dependency audit, production (high and critical)
        run: pnpm audit --prod --audit-level=high
